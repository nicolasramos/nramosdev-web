name: Sync YouTube → Blog

on:
  schedule:
    # Daily at 08:00 UTC — check for new videos
    - cron: '0 8 * * *'
  workflow_dispatch: # Allow manual trigger from Actions tab
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install dependencies
        run: npm ci

      - name: Run YouTube sync
        run: node scripts/sync-youtube.mjs

      - name: Check for new posts
        id: changes
        run: |
          # git status --porcelain catches NEW (untracked) posts too; bare
          # `git diff --quiet` does NOT see untracked files, so the sync was
          # silently never committing anything.
          if [ -z "$(git status --porcelain src/content/posts/)" ]; then
            echo "new_posts=false" >> "$GITHUB_OUTPUT"
            echo "No new posts detected."
          else
            echo "new_posts=true" >> "$GITHUB_OUTPUT"
            echo "New posts detected:"
            git status --porcelain src/content/posts/
          fi

      - name: Commit and push new posts
        if: steps.changes.outputs.new_posts == 'true'
        run: |
          git config user.name "nramosdev-bot"
          git config user.email "bot@nramos.dev"
          git add src/content/posts/
          DIFF_SUMMARY=$(git diff --cached --stat | tail -1)
          git commit -m "blog(sync): auto-sync YouTube videos — $DIFF_SUMMARY"
          git push

  deploy:
    if: always()
    needs: sync
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install dependencies
        run: npm ci

      - name: Build site
        run: npm run build

      - name: Deploy to VPS
        run: |
          set -euo pipefail
          if [ -z "$DEPLOY_SSH_KEY" ]; then
            echo "DEPLOY_SSH_KEY secret not set; skipping deploy"
            exit 0
          fi
          install -m 600 /dev/null /tmp/deploy_key
          printf '%s\n' "$DEPLOY_SSH_KEY" > /tmp/deploy_key
          chmod 600 /tmp/deploy_key
          tar -czf - -C dist . | ssh -i /tmp/deploy_key -o BatchMode=yes -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null \
            debian@37.59.103.126 deploy
          rm -f /tmp/deploy_key
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
